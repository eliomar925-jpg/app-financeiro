name: Nem Direita - Health Check

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public portal
        run: |
          set -e
          curl --fail --silent --show-error --location --max-time 30 https://nem-direita-nem-esquerda-brasil-m83fm8bez.vercel.app/ > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://nem-direita-nem-esquerda-brasil-m83fm8bez.vercel.app/api/health > health.json
          cat health.json
